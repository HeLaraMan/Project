<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Artist Search | Login</title>	
	<link rel="stylesheet" type="text/css" href="style.css">
	<script src="main.js"> </script>
</head>
<body>

	<!-- header code -->
	<!-- skeleton code from https://www.w3schools.com/howto/howto_css_responsive_header.asp -->
	<div class="header">
	  <a href="index.html">Artist Search</a>
	  <div class="header-right" id="header-right">
	    <a href="index.html">Search</a>
	    <a class="blue-button" href="login.html">Log in</a>
	    <a href="register.html">Register</a>
	  </div>
	</div>

	<!-- input form code -->
	<div class="form">
		<div class="box">
			<p class="title">Login</p>
			<!-- skeleton code from CSCI 201 HTML Lecture -->
			<!-- pattern input from https://www.w3schools.com/tags/att_input_pattern.asp -->
			<form name="myform" method="POST" onsubmit="return validateLogin();">
				<div id="emaillogindiv">
					<span class="labels">Email address</span><br />
					<input type="email" id="emaillogin" name="emaillogin" placeholder="Enter email" onblur="validateEmailLogin();" pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" required><br />
					<p class="invalid-email" id="emailLoginError"></p>
				</div>
				<div id="passworddiv">
					<span class="labels">Password</span><br />
					<input type="password" id="password" name="password" placeholder="Password" onblur="validatePassword();" required><br />
					<p class="invalid-email" id="passwordError"></p>
				</div>
				<button type="submit" id="button-send" disabled>Log in</button><br />
			</form>
		</div>
		<p class="gray">Don't have an account yet? <a class="register" href="register.html">Register</a></p>
	</div>
	
	<!-- footer code -->
	<div class="footer">
		<p class="footer-text">Powered by <img src="images/artsy_logo.svg" height=13px width=13px/><a href="https://www.artsy.net/"> Artsy.</a></p>
	</div>
	
	
</body>
</html>
