<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Artist Search | Favorites</title>
	<link rel="stylesheet" type="text/css" href="style.css">
	<script src="main.js"> </script>
</head>
<body>

	<!-- skeleton code from https://www.w3schools.com/howto/howto_css_responsive_header.asp -->
	<div class="header">
	  <a href="index.html">Artist Search</a>
	  <div class="header-right" id="header-right">
	    <a href="index.html">Search</a>
        <a href="favorites.html" class="blue-button">Favorites</a>
        <a href="#" onclick="logout()">Log out</a>
	  </div>
	</div>
	
	<!-- maintain a searchbar -->
	<div class="searchbar">
		<!-- skeleton code from CSCI 201 HTML Lecture -->
		<form name="myform" method="GET" onsubmit="return searchArtists();">
			<button type="submit"><img src="images/search_icon.png" height=25px width=25px></button>
			<input type="text" name="search" placeholder="Please enter an artist name." required>
			<button type="reset" name ="reset"><img src="images/clear_icon.png" height=25px width=25px></button>
		
		</form>
	</div>
	
	<div id="noresults"></div>

	<!-- displaying favorites here -->
	<div id="loading"></div>
	<div class="card-row" id="favoriteresult"></div>
	<div id="loading2" class="loading2"></div>
	<div id="artistinfo"></div>
	
	<!-- footer code -->
	<div class="footer">
		<p class="footer-text">Powered by <img src="images/artsy_logo.svg" height=13px width=13px/> <a href="https://www.artsy.net/"> Artsy.</a></p>
	</div>
	
</body>
</html>
