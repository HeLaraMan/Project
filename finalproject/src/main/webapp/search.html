<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Artist Search | Search</title>
	<link rel="stylesheet" type="text/css" href="style.css">
	<script src="main.js"></script>
</head>
<body>

	<!-- header skeleton code from https://www.w3schools.com/howto/howto_css_responsive_header.asp -->
	<div class="header">
	  <a href="search.html">Artist Search</a>
	  <div class="header-right" id="header-right">
	    <a class="blue-button" href="search.html">Search</a>
	    <a href="login.html">Log in</a>
	    <a href="register.html">Register</a>
	  </div>
	</div>

	<!-- this is for the artist search bar -->
	<div class="searchbar">
		<!-- skeleton code from CSCI 201 HTML Lecture -->
		<form name="myform" method="GET" onsubmit="return searchArtists();">
			<button type="submit"><img src="images/search_icon.png" height=25px width=25px></button>
			<input type="text" name="search" placeholder="Please enter an artist name." required>
			<button type="reset" name ="reset"><img src="images/clear_icon.png" height=25px width=25px></button>
		
		</form>
	</div>
	
	<div id="loading"></div>
	<div id="clicked"></div>
	<p id="getartist1"></p>
	
	<!-- this is where the search results are printed -->
	<div class="card-row" id="searchresults"></div>
	
	<!-- no results found button is here -->
	<div id="noresults"></div>
	
	<div id="loading2" class="loading2"></div>
	<div id="artistinfo"></div>
	
	<!-- this was for debugging purposes -->
	 
	<!-- <p id="searchresult1"></p>
	<p id="searchresult2"></p>
	<p id="searchresult3"></p>
	 -->
	 
	 <!-- <p id="insert"></p>
	 <p id="remove"></p> -->
	
	<!-- footer code -->
	<div class="footer">
		<p class="footer-text">Powered by <img src="images/artsy_logo.svg" height=13px width=13px/> <a href="https://www.artsy.net/"> Artsy.</a></p>
	</div>
	
</body>
</html>
