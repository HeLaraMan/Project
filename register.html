<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Artist Search | Register</title>
	<link rel="stylesheet" type="text/css" href="style.css">
	<script src="main.js"> </script>
</head>
<body>

	<!-- skeleton code from https://www.w3schools.com/howto/howto_css_responsive_header.asp -->
	<div class="header">
	  <a href="index.html">Artist Search</a>
	  <div class="header-right" id="header-right">
	    <a href="index.html">Search</a>
	    <a href="login.html">Log in</a>
	    <a class="blue-button" href="register.html">Register</a>
	  </div>
	</div>

	<div class="form">
		<div class="box">
			<p class="title">Register</p>
			<!-- skeleton code from CSCI 201 HTML Lecture -->
			<!-- pattern input from https://www.w3schools.com/tags/att_input_pattern.asp -->
			<form name="myform" method="POST" onsubmit="return validateRegistration();" action="RegisterServlet">
				<div id="fullnamediv">
					<span class="labels">Full Name</span><br />
					<input type="text" id="fullname" name="fullname" placeholder="John Doe" onblur="validateName();" required><br />
					<p class="invalid-email" id="fullnameError"></p>
				</div>
				<div id="emaildiv">
					<span class="labels">Email Address</span><br />
					<input type="email" id="email" name="email" placeholder="Enter email" onblur="validateEmail();" pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" required><br />
					 <p class="invalid-email" id="emailError"></p>
				</div>
				<div id="passworddiv">
					<span class="labels">Password</span><br />
					<input type="password" id="password" name="password" placeholder="Password" onblur="validatePassword();" required><br />
					<p class="invalid-email" id="passwordError"></p>
				</div>
				<!-- https://stackoverflow.com/a/69386726 -->
				<button type="submit" id="button-send" disabled>Register</button><br />
			</form>
		</div>
		<p class="gray">Already have an account? <a class="register" href="login.html">Login</a></p>
	</div>
	
	<!-- footer code -->
	<div class="footer">
		<p class="footer-text">Powered by <img src="images/artsy_logo.svg" height=13px width=13px/> <a href="https://www.artsy.net/"> Artsy.</a></p>
	</div>
	
</body>
</html>
